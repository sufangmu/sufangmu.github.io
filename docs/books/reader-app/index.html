<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 个人图书馆</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- EPUB.js + JSZip -->
  <script src="../../javascripts/jszip.min.js"></script>
  <script src="../../javascripts/epub.min.js"></script>

  <!-- 书库清单 -->
  <script src="data/books.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 侧边栏 — 树形分类菜单 -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo">📚</span>
        <h1>个人图书馆</h1>
        <button class="sidebar-toggle" id="sidebarToggle" title="收起/展开侧栏">☰</button>
      </div>
      <div class="sidebar-header">
        <h3>📖 藏书</h3>
        <span id="bookCount">--</span>
      </div>
      <div class="tree-menu" id="treeMenu">
        <!-- 动态渲染 -->
      </div>
      <div class="sidebar-footer">
        <p class="copyright">
          本平台仅用于个人学习与知识管理，所有电子书资源仅供个人阅读使用，不涉及任何商业用途。<br>
          如有侵权，请联系删除。
        </p>
      </div>
    </aside>

    <!-- 目录侧栏 -->
    <aside class="toc-sidebar" id="tocSidebar">
      <div class="toc-sidebar-header">
        <h3>📑 目录</h3>
      </div>
      <div class="toc-tree" id="tocTree">
        <p class="toc-empty">选择一本书以查看目录</p>
      </div>
    </aside>

    <!-- 阅读区 -->
    <main class="reader-panel">
      <!-- 空白状态 -->
      <div class="empty-state" id="emptyState">
        <span class="empty-icon">📖</span>
        <p>从左侧选择一本书开始阅读</p>
      </div>

      <!-- 加载进度 -->
      <div class="loading-state" id="loadingState">
        <p id="loadingText">加载中…</p>
        <div class="loading-bar-track">
          <div class="loading-bar-fill" id="loadingFill"></div>
        </div>
        <span class="loading-pct" id="loadingPct">0%</span>
      </div>

      <!-- 渲染区 -->
      <div class="reader-content" id="readerContent" style="display:none;">
        <div class="book-meta-bar">
          <h2 id="bookTitle"></h2>
          <span class="meta" id="bookMeta"></span>
          <span class="format-badge" id="formatBadge"></span>
        </div>
        <div class="render-area">
          <div id="epubView"></div>
          <div id="pdfView" style="display:none;"></div>
          <div id="textView" style="display:none;"></div>
        </div>
      </div>

      <!-- 底部控制栏 -->
      <div class="bottom-bar" id="bottomBar" style="display:none;">
        <div class="control-bar">
          <div class="ctrl-group-left">
              <button class="ctrl-btn" id="btnToc" title="显示/隐藏目录">📑 目录</button>
            <button class="ctrl-btn" id="btnMarker" title="画笔标记">🖊 标记</button>
            <span class="pen-tools" id="penTools" style="display:none;">
              <input type="range" id="penSize" min="2" max="60" value="10" class="pen-size-slider" title="笔刷大小">
              <span class="pen-size-val" id="penSizeVal">10</span>
              <span class="pen-color active" data-color="rgba(255,235,59,0.45)" style="background:rgba(255,235,59,0.7)" title="黄色荧光笔"></span>
              <span class="pen-color" data-color="rgba(76,175,80,0.4)" style="background:rgba(76,175,80,0.65)" title="绿色"></span>
              <span class="pen-color" data-color="rgba(244,67,54,0.35)" style="background:rgba(244,67,54,0.6)" title="红色"></span>
              <span class="pen-color" data-color="rgba(33,150,243,0.35)" style="background:rgba(33,150,243,0.6)" title="蓝色"></span>
              <button class="ctrl-btn pen-undo-btn" id="btnUndoStroke" title="撤销上一笔">↩</button>
              <button class="ctrl-btn pen-clear-btn" id="btnClearStrokes" title="清除本页标记">✕</button>
            </span>
            <button class="ctrl-btn" id="btnZoomOut" title="缩小">🔍−</button>
            <span id="zoomLabel" class="zoom-label">100%</span>
            <button class="ctrl-btn" id="btnZoomIn" title="放大">🔍+</button>
          </div>
          <div class="slider-wrapper">
            <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider">
          </div>
          <div class="ctrl-group-right">
            <button class="ctrl-btn" id="btnPrev" title="上一页 (←)">◀ 上一页</button>
            <span class="progress-text" id="progressText">-- / --</span>
            <button class="ctrl-btn" id="btnNext" title="下一页 (→)">下一页 ▶</button>
            <span id="pageInfo" class="page-info"></span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
