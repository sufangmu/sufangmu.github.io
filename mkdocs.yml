site_name: 苏方木的笔记
site_description: 苏方木的笔记
site_author: 苏方木
site_url: https://sufangmu.github.io
repo_url: https://github.com/sufangmu/sufangmu.github.io
repo_name: sufangmu/sufangmu.github.io
copyright: Copyright &copy; 2026 苏方木

theme:
  name: 'material'
  custom_dir: overrides
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch 
        name: 切换到明亮模式
      primary: light blue
    - scheme: slate 
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换到深色模式
      primary: black
  font:
    text: Ubuntu
    code: Ubuntu Mono
  language: zh
  programming: zh
  features:
    - navigation.top  # 返回顶部
    - search.suggest # 查询建议
    - search.highlight
    - navigation.tracking  # 锚点跟踪
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - header.autohide
    - content.code.copy  # 代码复制按钮
    - content.tabs.link  # 标签页同步
    - navigation.path  # 面包屑
    - navigation.progress  # 阅读进度条
    - navigation.footer  # 上/下篇
    


markdown_extensions:
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight:
      linenums: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.arithmatex:  # 数学表达式
      generic: true
  - pymdownx.details  # 可折叠详情
  - pymdownx.tabbed:  # 标签页
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sufangmu
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.7.2/highlight.min.js
  - javascripts/mathjax.js
  - javascripts/polyfill.min.js
  - javascripts/tex-mml-chtml.js
  - javascripts/nce-player.js
extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.7.2/styles/default.min.css
  - stylesheets/nce-player.css


plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - en
        - zh
  - git-revision-date-localized:
      type: date
      timezone: Asia/Shanghai
